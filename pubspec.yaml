environment:
  sdk: ^3.11.0

dependencies:
  path: ^1.9.1
  args: ^2.7.0
  mason_logger: ^0.3.6

dev_dependencies:
  build_runner: ^2.4.12
  lints: ^4.0.0
  test: ^1.25.8
  mockito: ^5.4.4

executables:
  gaza_flutter_cleaner: gaza_flutter_cleaner
